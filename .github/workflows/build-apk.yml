name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto (usa el ZIP con la versión más alta)
        id: proyecto
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error title=Falta el ZIP::No hay ningun archivo .zip en la raiz del repositorio. Sube gonen.zip."
            exit 1
          fi

          # Lee la version de cada ZIP y se queda con la mas alta. Asi da igual
          # que el movil haya renombrado el archivo nuevo (por ejemplo a "gonen (1).zip").
          best=$(for z in "${zips[@]}"; do
            v=$(unzip -p "$z" '*pubspec.yaml' 2>/dev/null | grep -m1 '^version:' | awk '{print $2}')
            echo "ZIP encontrado: $z (version ${v:-desconocida})" >&2
            echo "${v:-0.0.0+0} $z"
          done | sort -V | tail -n 1)

          version_full="${best%% *}"
          zipfile="${best#* }"
          version="${version_full%%+*}"

          if [ "$version_full" = "0.0.0+0" ]; then
            echo "::error title=ZIP no valido::Ningun .zip contiene un pubspec.yaml de Gonen."
            exit 1
          fi

          rm -rf proyecto
          mkdir proyecto
          unzip -q "$zipfile" -d proyecto
          if [ ! -f proyecto/gonen/pubspec.yaml ]; then
            echo "::error title=ZIP inesperado::El ZIP debe contener la carpeta gonen/ con el proyecto dentro."
            ls -R proyecto | head -n 40
            exit 1
          fi
          ls -la proyecto/gonen

          if [ -f proyecto/gonen/lib/screens/premium_screen.dart ]; then
            premium="si"
          else
            premium="NO"
          fi
          echo "::notice title=Version de Gonen::Compilando Gonen $version desde '$zipfile'. Premium incluido: $premium"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter 3.38 (versión fijada para que la compilación no cambie sola)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.x"
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Generar el proyecto Android
        working-directory: proyecto/gonen
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gonen --project-name gonen .
          fi

      - name: Adaptar el proyecto Android para Gonen
        working-directory: proyecto/gonen
        run: python3 tool/patch_android.py

      - name: Instalar dependencias
        working-directory: proyecto/gonen
        run: flutter pub get

      - name: Análisis estático
        working-directory: proyecto/gonen
        run: |
          flutter analyze 2>&1 | tee analyze.txt || true
          # Los errores salen arriba, en la página del resultado (apartado
          # "Annotations"), para poder verlos desde el móvil sin abrir el registro.
          errors=$(grep -cE '^\s*error' analyze.txt || true)
          echo "::notice title=Análisis de código::Errores encontrados: ${errors:-0}"
          grep -E '^\s*error' analyze.txt | head -n 15 | while IFS= read -r line; do
            line="${line//%/%25}"
            echo "::error title=Análisis de código::${line}"
          done || true

      - name: Pruebas
        working-directory: proyecto/gonen
        run: flutter test
        continue-on-error: true

      - name: Compilar el APK normal (con los pagos reales de Google Play)
        working-directory: proyecto/gonen
        run: |
          flutter build apk --release --dart-define=GONEN_PREMIUM_TEST=false
          mkdir -p salida
          cp build/app/outputs/flutter-apk/app-release.apk "salida/gonen-v${{ steps.proyecto.outputs.version }}.apk"

      - name: Compilar el APK de PRUEBA (Premium desbloqueado, no publicar nunca)
        working-directory: proyecto/gonen
        run: |
          flutter build apk --release --dart-define=GONEN_PREMIUM_TEST=true
          cp build/app/outputs/flutter-apk/app-release.apk "salida/gonen-PRUEBA-premium-v${{ steps.proyecto.outputs.version }}.apk"
          echo "::notice title=APK de prueba::Descarga el artefacto gonen-apk-PRUEBA-premium-v${{ steps.proyecto.outputs.version }} para probar todo Premium sin pagar."

      - name: Subir el APK normal
        uses: actions/upload-artifact@v4
        with:
          name: gonen-apk-v${{ steps.proyecto.outputs.version }}
          path: proyecto/gonen/salida/gonen-v${{ steps.proyecto.outputs.version }}.apk
          if-no-files-found: error

      - name: Subir el APK de PRUEBA con Premium
        uses: actions/upload-artifact@v4
        with:
          name: gonen-apk-PRUEBA-premium-v${{ steps.proyecto.outputs.version }}
          path: proyecto/gonen/salida/gonen-PRUEBA-premium-v${{ steps.proyecto.outputs.version }}.apk
          if-no-files-found: error
