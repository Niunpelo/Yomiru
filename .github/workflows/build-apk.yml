name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      premium_test:
        description: "SOLO PRUEBAS: desbloquear Premium sin pagar (no publiques este APK)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          rm -rf proyecto
          mkdir proyecto
          unzip -q gonen.zip -d proyecto
          ls -la proyecto/gonen

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter 3.38 (versión fijada para que la compilación no cambie sola)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.x"
          cache: true

      - name: Generar el proyecto Android
        working-directory: proyecto/gonen
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gonen --project-name gonen .
          fi

      - name: Adaptar el proyecto Android para Gonen
        working-directory: proyecto/gonen
        run: python3 tool/patch_android.py

      - name: Instalar dependencias
        working-directory: proyecto/gonen
        run: flutter pub get

      - name: Análisis estático
        working-directory: proyecto/gonen
        run: flutter analyze
        continue-on-error: true

      - name: Pruebas
        working-directory: proyecto/gonen
        run: flutter test
        continue-on-error: true

      - name: Compilar el APK
        working-directory: proyecto/gonen
        env:
          PREMIUM_TEST: ${{ inputs.premium_test || 'false' }}
        run: flutter build apk --release --dart-define=GONEN_PREMIUM_TEST=$PREMIUM_TEST

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.premium_test && 'gonen-apk-PRUEBA-premium' || 'gonen-apk' }}
          path: proyecto/gonen/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
