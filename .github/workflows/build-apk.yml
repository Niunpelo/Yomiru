name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          unzip -q yomiru.zip -d proyecto
          ls proyecto/yomiru

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter (última versión estable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar el proyecto Android
        working-directory: proyecto/yomiru
        run: flutter create --platforms=android --org com.yomiru --project-name yomiru .

      - name: Adaptar el proyecto Android
        working-directory: proyecto/yomiru
        run: python3 tool/patch_android.py

      - name: Instalar dependencias
        working-directory: proyecto/yomiru
        run: flutter pub get

      - name: Compilar el APK
        working-directory: proyecto/yomiru
        run: flutter build apk --release

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: yomiru-apk
          path: proyecto/yomiru/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
